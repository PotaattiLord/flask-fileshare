{% extends "base.html" %}

{% block content %}
    <h1>Upload File</h1>
    <form action="" method="post" enctype="multipart/form-data">
        {{ form.hidden_tag() }}
        {{ form.file.label }} {{ form.file() }}
        {{ form.is_public.label }} {{ form.is_public() }}
        {{ form.submit() }}
    </form>
{% endblock %}
